name: Release v0.3.24

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Restore first-release icon setup with the current R art
        run: |
          git rm -q -f --ignore-unmatch mobile/src/main/res/mipmap-mdpi/ic_launcher.webp mobile/src/main/res/mipmap-hdpi/ic_launcher.webp mobile/src/main/res/mipmap-xhdpi/ic_launcher.webp mobile/src/main/res/mipmap-xxhdpi/ic_launcher.webp mobile/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          mkdir -p mobile/src/main/res/mipmap
          cat > mobile/src/main/res/mipmap/ic_launcher.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              <monochrome android:drawable="@drawable/ic_launcher_monochrome"/>
          </adaptive-icon>
          XML_EOF
          base64 -d > mobile/src/main/res/drawable-nodpi/ic_launcher_foreground.png <<'B64_EOF'
          
          B64_EOF
          base64 -d > mobile/src/main/res/drawable-nodpi/ic_launcher_monochrome.png <<'B64_EOF'
          
          B64_EOF
          cat mobile/src/main/res/drawable/ic_launcher_background.xml
          ls -l mobile/src/main/res/drawable-nodpi/ic_launcher_*.png; ls mobile/src/main/res/mipmap*

      - name: Own provider authority and socket name
        run: |
          cat > /tmp/patch0324.py <<'PATCH_EOF'
          def sub(p,a,b):
              t=open(p,encoding='utf-8').read()
              assert t.count(a)==1,(p,a[:50],t.count(a))
              open(p,'w',encoding='utf-8').write(t.replace(a,b))
          sub('mobile/src/main/AndroidManifest.xml','android:authorities="be.mygod.vpnhotspot.log"','android:authorities="${applicationId}.log"')
          sub('mobile/src/main/java/be/mygod/vpnhotspot/ui/SettingsScreen.kt','FileProvider.getUriForFile(context, "be.mygod.vpnhotspot.log", logFile)','FileProvider.getUriForFile(context, context.packageName + ".log", logFile)')
          sub('mobile/src/main/java/be/mygod/vpnhotspot/root/daemon/DaemonController.kt','val socketName = "be.mygod.vpnhotspot.${Process.myPid()}','val socketName = "${app.packageName}.${Process.myPid()}')
          PATCH_EOF
          python3 /tmp/patch0324.py
          git diff --stat

      - name: Bump version
        run: |
          sed -i 's/versionName = ".*"/versionName = "0.3.24"/; s/versionCode = [0-9]*/versionCode = 32400/' mobile/build.gradle.kts
          grep -n versionName mobile/build.gradle.kts
          git add -A
          git -c user.name="ctmhod" -c user.email="290202009+ctmhod@users.noreply.github.com" commit -q -m "Use own provider authority so Routify installs next to VPN Hotspot (v0.3.24)" || true
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build Xray-core (unmodified, MPL 2.0)
        run: |
          TAG=v26.11.9
          git clone --depth 1 --branch $TAG https://github.com/XTLS/Xray-core /tmp/xray
          cd /tmp/xray
          for spec in arm64-v8a:arm64: armeabi-v7a:arm:7 x86_64:amd64: x86:386:; do
            abi=${spec%%:*}; rest=${spec#*:}; arch=${rest%%:*}; arm=${rest#*:}
            mkdir -p $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$arm go build -trimpath -ldflags "-s -w -buildid=" -o /tmp/xray-$abi ./main
            cp /tmp/xray-$abi $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi/libxray.so
          done
          ls -la $GITHUB_WORKSPACE/mobile/src/main/jniLibs/*/
          cd $GITHUB_WORKSPACE
          sed -i 's|^    packaging.resources.excludes += listOf(|    packaging.jniLibs.useLegacyPackaging = true\n    packaging.resources.excludes += listOf(|' mobile/build.gradle.kts
          grep -n "useLegacyPackaging\|keepDebugSymbols" mobile/build.gradle.kts

      - name: Set up permanent release signing
        env:
          KS_B64: ${{ secrets.ROUTIFY_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/routify-release.p12"
          cat > /tmp/sign.py <<'PY_EOF'
          p='mobile/build.gradle.kts'
          t=open(p).read()
          blk = """    signingConfigs {
                  create("routify") {
                      val ksPath = System.getenv("ROUTIFY_KEYSTORE_PATH")
                      if (ksPath != null) {
                          storeFile = file(ksPath)
                          storePassword = System.getenv("ROUTIFY_KEY_PASSWORD")
                          keyAlias = "routify"
                          keyPassword = System.getenv("ROUTIFY_KEY_PASSWORD")
                          enableV1Signing = true
                          enableV2Signing = true
                          enableV3Signing = true
                      }
                  }
              }
          """
          if 'create("routify")' not in t:
              t=t.replace("    buildTypes {", blk+"    buildTypes {",1)
              t=t.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = if (System.getenv("ROUTIFY_KEYSTORE_PATH") != null) signingConfigs.getByName("routify") else signingConfigs.getByName("debug")',1)
          open(p,'w').write(t)
          PY_EOF
          python3 /tmp/sign.py
          grep -n 'routify' mobile/build.gradle.kts | head

      - name: Build release APKs
        env:
          ROUTIFY_KEYSTORE_PATH: ${{ runner.temp }}/routify-release.p12
          ROUTIFY_KEY_PASSWORD: ${{ secrets.ROUTIFY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Collect APKs
        env:
          ROUTIFY_KEYSTORE_PATH: ${{ runner.temp }}/routify-release.p12
          ROUTIFY_KEY_PASSWORD: ${{ secrets.ROUTIFY_KEY_PASSWORD }}
        run: |
          find mobile/build/outputs/apk/release -name '*.apk' -exec ls -l {} \;
          mkdir out
          for f in mobile/build/outputs/apk/release/*.apk; do
            case "$f" in
              *universal*) cp "$f" out/Routify-v0.3.24-0-universal.apk ;;
              *arm64-v8a*) cp "$f" out/Routify-v0.3.24-arm64-v8a.apk ;;
              *armeabi-v7a*) cp "$f" out/Routify-v0.3.24-armeabi-v7a.apk ;;
              *x86_64*) cp "$f" out/Routify-v0.3.24-x86_64.apk ;;
              *x86*) cp "$f" out/Routify-v0.3.24-x86.apk ;;
            esac
          done
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=out/Routify-v0.3.24-0-universal.apk
          zip -q -d $U 'lib/x86/*' 'lib/x86_64/*' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/MANIFEST.MF'
          $BT/zipalign -p -f 4 $U /tmp/u-aligned.apk
          $BT/apksigner sign --ks "$ROUTIFY_KEYSTORE_PATH" --ks-pass env:ROUTIFY_KEY_PASSWORD --key-pass env:ROUTIFY_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out $U /tmp/u-aligned.apk
          $BT/apksigner verify --print-certs $U | head -3
          unzip -l $U | grep -c 'lib/x86' || true
          for f in out/*.apk; do
            n=$(unzip -p "$f" 'classes*.dex' | grep -ac 'Paste vless')
            echo "$f has VPN screen strings: $n"
            test "$n" -ge 1
          done
          ls -l out
          test -f out/Routify-v0.3.24-0-universal.apk && test -f out/Routify-v0.3.24-arm64-v8a.apk && test -f out/Routify-v0.3.24-armeabi-v7a.apk && test -f out/Routify-v0.3.24-x86.apk && test -f out/Routify-v0.3.24-x86_64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: out

      - name: Publish v0.3.24
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=$(du -h out/Routify-v0.3.24-arm64-v8a.apk | cut -f1)
          V=$(du -h out/Routify-v0.3.24-armeabi-v7a.apk | cut -f1)
          X=$(du -h out/Routify-v0.3.24-x86.apk | cut -f1)
          Y=$(du -h out/Routify-v0.3.24-x86_64.apk | cut -f1)
          U=$(du -h out/Routify-v0.3.24-0-universal.apk | cut -f1)
          cat > notes.md <<NOTES
          Routify v0.3.24

          Which file to download:
          - Routify-v0.3.24-0-universal.apk ($U): main option. One file with the ARM types (arm64-v8a and armeabi-v7a). Works on almost every phone and tablet. Not for x86 devices.
          - Routify-v0.3.24-arm64-v8a.apk ($A): smaller, for most modern phones (64-bit ARM).
          - Routify-v0.3.24-armeabi-v7a.apk ($V): smaller, for older 32-bit ARM phones.
          - Routify-v0.3.24-x86_64.apk ($Y): 64-bit x86 devices and emulators.
          - Routify-v0.3.24-x86.apk ($X): 32-bit x86 devices and emulators.
          Not sure which one? Use the universal file.

          New in this version:
          - Fix: install no longer fails with "provider name be.mygod.vpnhotspot.log is already used" when the original VPN Hotspot app is installed. Routify now uses its own app.routify names.
          - Needs Android 10 or newer (not the Galaxy Tab A6, which stops at Android 8.1).
          - If Android says "App not installed", uninstall the older Routify first (for all users), then install this file.

          Known limits (honest):
          - UDP needs TPROXY kernel support (many Android kernels have it, some do not).
          - IPv4 only. Needs root. Not tested on a real phone.
          - Xray-core v26.11.9 is built from its public source in the GitHub build. Credit is in NOTICE.

          Honest status:
          - Not tested on a real device. It compiled on GitHub servers, nothing more.
          - Needs a rooted Android 10 or newer phone.
          - Signed with the permanent Routify key. Later updates install over this one.
          NOTES
          sed -i 's/^ *//' notes.md
          gh release create v0.3.24 out/Routify-v0.3.24-0-universal.apk out/Routify-v0.3.24-arm64-v8a.apk out/Routify-v0.3.24-armeabi-v7a.apk out/Routify-v0.3.24-x86_64.apk out/Routify-v0.3.24-x86.apk --target main --latest --title "Routify v0.3.24" --notes-file notes.md
          gh release view v0.3.24 --json assets --jq '.assets[] | [.name, .size] | @tsv'
