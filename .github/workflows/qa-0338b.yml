          mkdir -p smoke

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: bash run.sh

      - name: Upload README screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-screens
          path: shots
          retention-days: 7

      - name: Upload test output (not committed)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            smoke
            server-access.log
            server.out
            server2.out
            server3.out
          retention-days: 3
