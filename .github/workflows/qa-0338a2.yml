      - name: Make test APKs for the validation checks
        env:
          ROUTIFY_KEYSTORE_PATH: ${{ runner.temp }}/routify-release.p12
          ROUTIFY_KEY_PASSWORD: ${{ secrets.ROUTIFY_KEY_PASSWORD }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          AJ=$ANDROID_HOME/platforms/android-37.0/android.jar
          mkdir -p /tmp/neg; cd /tmp/neg
          keytool -genkeypair -keystore other.jks -storepass otherpass -keypass otherpass -alias other -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Other" 2>/dev/null
          mk() { # name package versionCode
            cat > m-$1.xml <<MEOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="$2" android:versionCode="$3" android:versionName="9.9.9"><application/></manifest>
          MEOF
            sed -i 's/^ *//' m-$1.xml
            $BT/aapt2 link -o $1-unsigned.apk --manifest m-$1.xml -I $AJ --min-sdk-version 29 --target-sdk-version 30
          }
          mk wrongapp com.example.otherapp 99999
          mk wrongsigner app.routify 99999
          mk equal app.routify 100
          $BT/apksigner sign --ks other.jks --ks-pass pass:otherpass --key-pass pass:otherpass --out wrongapp.apk wrongapp-unsigned.apk
          $BT/apksigner sign --ks other.jks --ks-pass pass:otherpass --key-pass pass:otherpass --out wrongsigner.apk wrongsigner-unsigned.apk
          $BT/apksigner sign --ks "$ROUTIFY_KEYSTORE_PATH" --ks-pass env:ROUTIFY_KEY_PASSWORD --key-pass env:ROUTIFY_KEY_PASSWORD --ks-key-alias routify --out equal.apk equal-unsigned.apk
          ls -l /tmp/neg/*.apk
          chmod a+r /tmp/neg/*.apk

      - name: Enable KVM
        run: |
