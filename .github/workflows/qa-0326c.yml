          eVNlcnZpY2UuamF2YQpAQCAtMCwwICsxLDE2IEBACitwYWNrYWdlIGhldi5odHByb3h5OworCisvKiogSk5JIGJyaWRnZSB0byBo
          ZXYtc29ja3M1LXR1bm5lbCAoTUlUIGxpY2Vuc2UpLCB3aGljaCB0dXJucyB0aGUgVlBOIGludGVyZmFjZSBpbnRvIFNPQ0tTNSB0
          cmFmZmljLiAqLworcHVibGljIGNsYXNzIFRQcm94eVNlcnZpY2UgeworICAgIHN0YXRpYyB7CisgICAgICAgIFN5c3RlbS5sb2Fk
          TGlicmFyeSgiaGV2LXNvY2tzNS10dW5uZWwiKTsKKyAgICB9CisKKyAgICBwdWJsaWMgc3RhdGljIG5hdGl2ZSBib29sZWFuIFRQ
          cm94eVN0YXJ0U2VydmljZShTdHJpbmcgY29uZmlnUGF0aCwgaW50IGZkKTsKKworICAgIHB1YmxpYyBzdGF0aWMgbmF0aXZlIGJv
          b2xlYW4gVFByb3h5U3RvcFNlcnZpY2UoKTsKKworICAgIHB1YmxpYyBzdGF0aWMgbmF0aXZlIGJvb2xlYW4gVFByb3h5SXNSdW5u
