          disable-animations: true
          script: bash run.sh

      - name: Upload README screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-screens
          path: shots
          retention-days: 7

      - name: Upload test output (not committed)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            smoke
            server-access.log
            server.out
            server2.out
            server3.out
          retention-days: 3
