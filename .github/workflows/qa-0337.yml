      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build Xray-core (unmodified, MPL 2.0)
        run: |
          TAG=v26.11.9
          git clone --depth 1 --branch $TAG https://github.com/XTLS/Xray-core /tmp/xray
          cd /tmp/xray
          for spec in arm64-v8a:arm64: armeabi-v7a:arm:7 x86_64:amd64: x86:386:; do
            abi=${spec%%:*}; rest=${spec#*:}; arch=${rest%%:*}; arm=${rest#*:}
            mkdir -p $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$arm go build -trimpath -ldflags "-s -w -buildid=" -o /tmp/xray-$abi ./main
            cp /tmp/xray-$abi $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi/libxray.so
          done
          cp /tmp/xray-x86_64 $GITHUB_WORKSPACE/xray-x86_64
          cd $GITHUB_WORKSPACE
          sed -i 's|^    packaging.resources.excludes += listOf(|    packaging.jniLibs.useLegacyPackaging = true\n    packaging.resources.excludes += listOf(|' mobile/build.gradle.kts
          grep -n "useLegacyPackaging" mobile/build.gradle.kts

      - name: Build hev-socks5-tunnel (MIT) for all four ABIs
        run: |
          mkdir -p /tmp/hevb
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel /tmp/hevb/jni
          cd /tmp/hevb/jni && git checkout -q d8a32b2 && git submodule update --init --recursive && cd /tmp/hevb
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=/tmp/hevb APP_BUILD_SCRIPT=/tmp/hevb/jni/Android.mk NDK_APPLICATION_MK=/tmp/hevb/jni/Application.mk -j4
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi
            cp /tmp/hevb/libs/$abi/libhev-socks5-tunnel.so $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi/
          done
          ls -l $GITHUB_WORKSPACE/mobile/src/main/jniLibs/*/
      - name: Set up release signing
        env:
          KS_B64: ${{ secrets.ROUTIFY_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/routify-release.p12"
          cat > /tmp/sign.py <<'PY_EOF'
          p='mobile/build.gradle.kts'
          t=open(p).read()
          blk = """    signingConfigs {
                  create("routify") {
                      val ksPath = System.getenv("ROUTIFY_KEYSTORE_PATH")
                      if (ksPath != null) {
                          storeFile = file(ksPath)
                          storePassword = System.getenv("ROUTIFY_KEY_PASSWORD")
                          keyAlias = "routify"
                          keyPassword = System.getenv("ROUTIFY_KEY_PASSWORD")
                          enableV1Signing = true
                          enableV2Signing = true
                          enableV3Signing = true
                      }
                  }
              }
          """
          if 'create("routify")' not in t:
              t=t.replace("    buildTypes {", blk+"    buildTypes {",1)
              t=t.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = if (System.getenv("ROUTIFY_KEYSTORE_PATH") != null) signingConfigs.getByName("routify") else signingConfigs.getByName("debug")')
          open(p,'w').write(t)
          PY_EOF
          python3 /tmp/sign.py
          grep -n 'routify' mobile/build.gradle.kts | head
      - name: Build release APKs
        env:
          ROUTIFY_KEYSTORE_PATH: ${{ runner.temp }}/routify-release.p12
          ROUTIFY_KEY_PASSWORD: ${{ secrets.ROUTIFY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Pick x86_64 APK
        run: |
          ls -l mobile/build/outputs/apk/release/
          cp mobile/build/outputs/apk/release/*x86_64*.apk /tmp/test-x86_64.apk
          echo "APKSIZE=$(du -h /tmp/test-x86_64.apk | cut -f1)"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write test script and local test server
        run: |
          cat > test.py <<'PY_EOF'
          import subprocess,re,time,os,json,html,socket
          os.makedirs('smoke',exist_ok=True)
          R=[]
          def sh(c,t=90):
              p=subprocess.run(c,shell=True,capture_output=True,text=True,timeout=t); return (p.stdout+p.stderr)
          def adb(c,t=90): return sh('adb '+c,t)
          def log(s): R.append(s); print(s,flush=True)
          def dismiss_anr():
              for i in range(3):
                  adb('shell uiautomator dump /sdcard/a.xml'); x=adb('shell cat /sdcard/a.xml')
                  if "isn't responding" in x or 'isn&apos;t responding' in x:
                      m=re.search(r'text="Wait"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',x)
                      if m:
                          a=list(map(int,m.groups())); adb(f'shell input tap {(a[0]+a[2])//2} {(a[1]+a[3])//2}'); time.sleep(2)
                  else: break
          def shot(n):
              dismiss_anr()
              with open(f'smoke/{n}.png','wb') as f: f.write(subprocess.run('adb exec-out screencap -p',shell=True,capture_output=True).stdout)
          import xml.etree.ElementTree as ET
          def nodes():
              adb('shell uiautomator dump /sdcard/u.xml'); adb('pull /sdcard/u.xml smoke/ui.xml')
              out=[]
              for n in ET.parse('smoke/ui.xml').iter('node'):
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.get('bounds',''))
                  if m:
                      a=list(map(int,m.groups())); out.append((n.get('text',''),n.get('content-desc',''),((a[0]+a[2])//2,(a[1]+a[3])//2)))
              os.remove('smoke/ui.xml'); return out
          def texts(): return [t for t,d,x in nodes() if t]
          def tap(l,tries=1):
              for i in range(tries):
                  for t,d,xy in nodes():
                      if t==l or d==l:
                          adb(f'shell input tap {xy[0]} {xy[1]}'); time.sleep(2.5); return True
                  time.sleep(2)
              log('NOT FOUND: '+l); return False
          SZ=re.search(r'(\d+)x(\d+)',adb('shell wm size')); W,H=int(SZ.group(1)),int(SZ.group(2))
          def nav(i): adb(f'shell input tap {int(W*(0.125+0.25*i))} {int(H*0.885)}'); time.sleep(3)
          LINK='vless://11111111-2222-3333-4444-555555555555@10-0-2-2.sslip.io:10452?type=ws&security=tls&path=%2Fvpnjantit&host=digital.test&sni=digital.test&encryption=none#Al-Fatiha'
          LINK_DBL='vless://11111111-2222-3333-4444-555555555555@10-0-2-2.sslip.io:10452?type=ws&security=tls&path=%252Fvpnjantit&host=digital.test&sni=digital.test&encryption=none#doubleenc'
          LINK_NOPATH='vless://11111111-2222-3333-4444-555555555555@10-0-2-2.sslip.io:10452?type=ws&security=tls&path=%2Fnope&host=digital.test&sni=digital.test&encryption=none#wrongpath'
          LINK_BAD='vless://11111111-2222-3333-4444-555555555555@10-0-2-2.sslip.io:10444?type=ws&security=tls&path=%2Fvless&host=digital.test&sni=digital.test&encryption=none#badcert'
          def seed(phone,allow=False,insecure=False,mode='auto',link=None):
              link=link or LINK
              adb('shell am force-stop app.routify'); adb('root'); time.sleep(3)
              adb('shell mkdir -p /data/data/app.routify/shared_prefs')
              px='<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><string name="log_level">info</string><string name="mode">%s</string><boolean name="allow_insecure" value="%s" /><boolean name="phone_vpn" value="%s" /><boolean name="force_allowlist" value="%s" /><int name="selected" value="0" /><string name="links">%s</string></map>'%(mode,'true' if insecure else 'false','true' if phone else 'false','true' if allow else 'false',html.escape(json.dumps([link]),quote=False))
              open('p.xml','w').write(px); adb('push p.xml /data/data/app.routify/shared_prefs/routify_xray.xml'); os.remove('p.xml')
              uid=adb('shell stat -c %u /data/data/app.routify').strip()
              adb('shell chown -R '+uid+':'+uid+' /data/data/app.routify/shared_prefs'); adb('shell restorecon -R /data/data/app.routify/shared_prefs')
              adb('shell rm -rf /data/data/app.routify/app_xray'); adb('unroot'); time.sleep(3); adb('wait-for-device')
          def start_app():
              adb('shell monkey -p app.routify -c android.intent.category.LAUNCHER 1'); time.sleep(8); nav(2); time.sleep(2)
          def srvlog(): return open('server-access.log').read() if os.path.exists('server-access.log') else ''
          def nc_http(host,port=80,extra=''):
              return adb(f'shell "printf \'GET / HTTP/1.0\\r\\nHost: {host}\\r\\n\\r\\n\' | toybox nc -w 8 {host} {port} | head -3"',30)
          def tun(): return adb('shell ip addr show tun0').strip()
          def stage(name): log('--- '+name)



          def dumplogs(tag):
              adb('root'); time.sleep(3); adb('wait-for-device')
              out=adb("shell 'for f in $(find /data/data/app.routify -name \"*.log\" -o -name \"*applog*\" 2>/dev/null); do echo \"== $f\"; tail -c 900 $f | sed -E \"s/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<id>/g\"; done'")
              open('smoke/logs-'+tag+'.txt','w').write(out)
              adb('unroot'); time.sleep(3); adb('wait-for-device')

          adb('logcat -c')
          adb('shell settings put global hide_error_dialogs 1'); adb('shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS'); time.sleep(20)
          def appscreen(): return ', '.join(texts()[:30])
          def reset():
              adb('shell am force-stop app.routify'); adb('root'); time.sleep(3); adb('wait-for-device')
              adb('shell rm -f /data/data/app.routify/shared_prefs/routify_battery.xml'); adb('shell dumpsys deviceidle whitelist -app.routify'); adb('unroot'); time.sleep(3); adb('wait-for-device')
          def has_prefix(p): return [tx for tx,d,xy in nodes() if tx.startswith(p)]
          def tap_prefix(p):
              for tx,d,xy in nodes():
                  if tx.startswith(p):
                      adb(f'shell input tap {xy[0]} {xy[1]}'); time.sleep(2.5); return True
              log('NOT FOUND prefix: '+p); return False
          def wl(): return adb('shell dumpsys deviceidle whitelist').strip()
          def open_tethering():
              adb('shell monkey -p app.routify -c android.intent.category.LAUNCHER 1'); time.sleep(8); nav(0); time.sleep(2)
          os.makedirs('shots',exist_ok=True)
          CR=(84,2124)
          def rshot(n):
              dismiss_anr()
              raw=subprocess.run('adb exec-out screencap -p',shell=True,capture_output=True).stdout
              open('shots/raw.png','wb').write(raw)
              sh(f'convert shots/raw.png -crop 1080x{CR[1]}+0+{CR[0]} +repage shots/{n}.png'); os.remove('shots/raw.png')
              log('shot '+n+': '+', '.join(texts()[:8]))
          def swipe_up(): adb(f'shell input swipe {W//2} {int(H*0.72)} {W//2} {int(H*0.30)} 500'); time.sleep(2)
          def back(): adb('shell input keyevent 4'); time.sleep(2)
          def pregrant():
              for p in ['ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','POST_NOTIFICATIONS']:
                  adb('shell pm grant app.routify android.permission.'+p)
              adb('root'); time.sleep(3); adb('wait-for-device'); adb('shell dumpsys deviceidle whitelist +app.routify'); adb('unroot'); time.sleep(3); adb('wait-for-device')
          def scrolling(prefix,maxn=5):
              last=None
              for i in range(1,maxn+1):
                  rshot(f'{prefix}-{i}')
                  cur=open(f'shots/{prefix}-{i}.png','rb').read()
                  if cur==last:
                      os.remove(f'shots/{prefix}-{i}.png'); break
                  last=cur; swipe_up()
              return
          stage('R: README screenshots, one image per screen')
          seed(False,mode='proxy'); pregrant()
          adb('shell monkey -p app.routify -c android.intent.category.LAUNCHER 1'); time.sleep(9)
          nav(0); time.sleep(2); scrolling('01-tethering',2)
          nav(0); tap('Repeater'); time.sleep(3); rshot('02-repeater'); back()
          nav(1); time.sleep(3); rshot('03-clients')
          nav(2); time.sleep(3); rshot('04-vpn-with-server')
          swipe_up(); rshot('05-vpn-options'); 
          nav(2)
          tap('Connect'); time.sleep(14); rshot('06-vpn-connected')
          swipe_up(); rshot('07-vpn-connected-details')
          tap('Disconnect'); time.sleep(3)
          nav(3); time.sleep(3)
          scrolling('08-settings',6)
          # theme picker
          nav(3); time.sleep(2)
          for i in range(6):
              if any(x=='Theme' for x in texts()): break
              swipe_up()
          if tap('Theme'): time.sleep(2); rshot('09-theme-picker'); back()
          fatal=sh("adb logcat -d | grep -E 'FATAL EXCEPTION|AndroidRuntime.*app.routify' | head -5").strip()
          log('crash/fatal in logcat: '+(fatal or 'none'))
          log('files: '+', '.join(sorted(os.listdir('shots'))))
          open('smoke/report.txt','w').write('\n'.join(R))

          PY_EOF
          cat > server.json <<'JS_EOF'
          {"log":{"loglevel":"warning","access":"/home/runner/work/server-access.log"},"inbounds":[{"port":10443,"listen":"0.0.0.0","protocol":"vless","settings":{"clients":[{"id":"11111111-2222-3333-4444-555555555555"}],"decryption":"none"}}],"outbounds":[{"protocol":"freedom"}]}
          JS_EOF
          sed -i 's|/home/runner/work/server-access.log|'"$PWD"'/server-access.log|' server.json
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k.pem -out /tmp/c.pem -days 30 -subj "/CN=wrong.example" 2>/dev/null
          cat > server2.json <<'JS2_EOF'
          {"log":{"loglevel":"warning","access":"SRVLOG"},"inbounds":[{"port":10444,"listen":"0.0.0.0","protocol":"vless","settings":{"clients":[{"id":"11111111-2222-3333-4444-555555555555"}],"decryption":"none"},"streamSettings":{"network":"ws","security":"tls","tlsSettings":{"certificates":[{"certificateFile":"/tmp/c.pem","keyFile":"/tmp/k.pem"}]},"wsSettings":{"path":"/vless"}}}],"outbounds":[{"protocol":"freedom"}]}
          JS2_EOF
          sed -i 's|SRVLOG|'"$PWD"'/server-access.log|' server2.json
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k3.pem -out /tmp/c3.pem -days 30 -subj "/CN=10-0-2-2.sslip.io" -addext "subjectAltName=DNS:10-0-2-2.sslip.io" 2>/dev/null
          cat > server3.json <<'JS3_EOF'
          {"log":{"loglevel":"warning","access":"SRVLOG"},"inbounds":[{"port":10452,"listen":"0.0.0.0","protocol":"vless","settings":{"clients":[{"id":"11111111-2222-3333-4444-555555555555"}],"decryption":"none"},"streamSettings":{"network":"ws","security":"tls","tlsSettings":{"certificates":[{"certificateFile":"/tmp/c3.pem","keyFile":"/tmp/k3.pem"}]},"wsSettings":{"path":"/vpnjantit"}}}],"outbounds":[{"protocol":"freedom"}]}
          JS3_EOF
          sed -i 's|SRVLOG|'"$PWD"'/server-access.log|' server3.json
          cat > run.sh <<'SH_EOF'
          set -x
          ./xray-x86_64 run -c server.json > server.out 2>&1 &
          ./xray-x86_64 run -c server2.json > server2.out 2>&1 &
          ./xray-x86_64 run -c server3.json > server3.out 2>&1 &
          sleep 2
          adb install -r /tmp/test-x86_64.apk 2>&1 | tee smoke/install.txt
          python3 test.py
          SH_EOF
          mkdir -p smoke

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: bash run.sh

      - name: Upload README screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-screens
          path: shots
          retention-days: 7

      - name: Upload test output (not committed)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            smoke
            server-access.log
            server.out
            server2.out
            server3.out
          retention-days: 3
