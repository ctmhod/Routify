name: Release v0.3.37

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Apply the phone VPN change
        run: |
          base64 -d > /tmp/phonevpn.diff <<'B64_EOF'
          ZGlmZiAtLWdpdCBhL1JFQURNRS5tZCBiL1JFQURNRS5tZAppbmRleCA2ODJiM2Q5Li5kZWM4ZTQ1IDEwMDY0NAotLS0gYS9SRUFE
          TUUubWQKKysrIGIvUkVBRE1FLm1kCkBAIC0yNiw2ICsyNiwxMyBAQCBUaGUgYXBwIGhhcyBmb3VyIHRhYnM6CiAKIEJ5IGRlZmF1
          bHQgUm91dGlmeSBjaGVja3MgdGhlIHNlcnZlcidzIFRMUyBjZXJ0aWZpY2F0ZS4gSWYgeW91IHJ1biB5b3VyIG93biBzZXJ2ZXIg
          YW5kIGl0cyBjZXJ0aWZpY2F0ZSBoYXMgZXhwaXJlZCBvciBpcyBzZWxmLW1hZGUsIHlvdSBjYW4gdHVybiBvbiAqKlNldHRpbmdz
          ID4gQWxsb3cgdW50cnVzdGVkIHNlcnZlciBjZXJ0aWZpY2F0ZSoqLiBSb3V0aWZ5IHRoZW4gcmVhZHMgdGhlIGNlcnRpZmljYXRl
          IHRoZSBzZXJ2ZXIgc2hvd3MgYW5kIHBpbnMgaXQgYnkgaXRzIFNIQS0yNTYgaGFzaCwgc28gb25seSB0aGF0IGV4YWN0IGNlcnRp
          ZmljYXRlIGlzIGFjY2VwdGVkLiBMZWF2ZSBpdCBvZmYgdW5sZXNzIHlvdSBrbm93IHdoeSB5b3UgbmVlZCBpdC4KIAorIyMgU2Ny
          ZWVuc2hvdHMKKworVGFrZW4gb24gYW4gQW5kcm9pZCAxMSBlbXVsYXRvciB3aXRoIFJvdXRpZnkgdjAuMy4zNy4KKworPCEtLSBz
          Y3JlZW5zaG90czpzdGFydCAtLT4KKzwhLS0gc2NyZWVuc2hvdHM6ZW5kIC0tPgorCiAjIyBSZXF1aXJlbWVudHMKIAogLSBBbmRy
          b2lkIDEwIG9yIG5ld2VyIChBUEkgMjkrKQo=
          B64_EOF
          git apply --whitespace=nowarn /tmp/phonevpn.diff

          git status --short
          sed -i 's/versionName = ".*"/versionName = "0.3.37"/; s/versionCode = [0-9]*/versionCode = 33700/' mobile/build.gradle.kts
          grep -n versionName mobile/build.gradle.kts


      - name: Add README screenshots from the QA run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/screenshots
          gh run download 46137347964 --repo ctmhod/Routify -n readme-screens -D docs/screenshots
          ls -l docs/screenshots
          python3 - <<'PYEOF'
          import os,re
          fs=sorted(f for f in os.listdir("docs/screenshots") if f.endswith(".png"))
          rows=[]
          for f in fs:
              t=re.sub(r"^\d+-","",f[:-4]).replace("-"," ")
              rows.append('<img src="docs/screenshots/%s" alt="%s" width="240">'%(f,t))
          g="\n".join(rows)
          s=open("README.md").read()
          a=s.index("<!-- screenshots:start -->")+len("<!-- screenshots:start -->"); b=s.index("<!-- screenshots:end -->")
          open("README.md","w").write(s[:a]+"\n"+g+"\n"+s[b:])
          PYEOF

      - name: Commit and push source
        run: |
          git add -A
          git -c user.name="ctmhod" -c user.email="290202009+ctmhod@users.noreply.github.com" commit -q -m "README screenshots (v0.3.37)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build Xray-core (unmodified, MPL 2.0)
        run: |
          TAG=v26.11.9
          git clone --depth 1 --branch $TAG https://github.com/XTLS/Xray-core /tmp/xray
          cd /tmp/xray
          for spec in arm64-v8a:arm64: armeabi-v7a:arm:7 x86_64:amd64: x86:386:; do
            abi=${spec%%:*}; rest=${spec#*:}; arch=${rest%%:*}; arm=${rest#*:}
            mkdir -p $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$arm go build -trimpath -ldflags "-s -w -buildid=" -o /tmp/xray-$abi ./main
            cp /tmp/xray-$abi $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi/libxray.so
          done
          cp /tmp/xray-x86_64 $GITHUB_WORKSPACE/xray-x86_64
          cd $GITHUB_WORKSPACE
          sed -i 's|^    packaging.resources.excludes += listOf(|    packaging.jniLibs.useLegacyPackaging = true\n    packaging.resources.excludes += listOf(|' mobile/build.gradle.kts
          grep -n "useLegacyPackaging" mobile/build.gradle.kts

      - name: Build hev-socks5-tunnel (MIT) for all four ABIs
        run: |
          mkdir -p /tmp/hevb
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel /tmp/hevb/jni
          cd /tmp/hevb/jni && git checkout -q d8a32b2 && git submodule update --init --recursive && cd /tmp/hevb
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=/tmp/hevb APP_BUILD_SCRIPT=/tmp/hevb/jni/Android.mk NDK_APPLICATION_MK=/tmp/hevb/jni/Application.mk -j4
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            mkdir -p $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi
            cp /tmp/hevb/libs/$abi/libhev-socks5-tunnel.so $GITHUB_WORKSPACE/mobile/src/main/jniLibs/$abi/
          done
          ls -l $GITHUB_WORKSPACE/mobile/src/main/jniLibs/*/
      - name: Set up release signing
        env:
          KS_B64: ${{ secrets.ROUTIFY_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/routify-release.p12"
          cat > /tmp/sign.py <<'PY_EOF'
          p='mobile/build.gradle.kts'
          t=open(p).read()
          blk = """    signingConfigs {
                  create("routify") {
                      val ksPath = System.getenv("ROUTIFY_KEYSTORE_PATH")
                      if (ksPath != null) {
                          storeFile = file(ksPath)
                          storePassword = System.getenv("ROUTIFY_KEY_PASSWORD")
                          keyAlias = "routify"
                          keyPassword = System.getenv("ROUTIFY_KEY_PASSWORD")
                          enableV1Signing = true
                          enableV2Signing = true
                          enableV3Signing = true
                      }
                  }
              }
          """
          if 'create("routify")' not in t:
              t=t.replace("    buildTypes {", blk+"    buildTypes {",1)
              t=t.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = if (System.getenv("ROUTIFY_KEYSTORE_PATH") != null) signingConfigs.getByName("routify") else signingConfigs.getByName("debug")')
          open(p,'w').write(t)
          PY_EOF
          python3 /tmp/sign.py
          grep -n 'routify' mobile/build.gradle.kts | head
      - name: Build release APKs
        env:
          ROUTIFY_KEYSTORE_PATH: ${{ runner.temp }}/routify-release.p12
          ROUTIFY_KEY_PASSWORD: ${{ secrets.ROUTIFY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Collect APKs
        env:
          ROUTIFY_KEYSTORE_PATH: ${{ runner.temp }}/routify-release.p12
          ROUTIFY_KEY_PASSWORD: ${{ secrets.ROUTIFY_KEY_PASSWORD }}
        run: |
          mkdir out
          for f in mobile/build/outputs/apk/release/*.apk; do
            case "$f" in
              *universal*) cp "$f" out/Routify-v0.3.37-0-universal.apk ;;
              *arm64-v8a*) cp "$f" out/Routify-v0.3.37-arm64-v8a.apk ;;
              *armeabi-v7a*) cp "$f" out/Routify-v0.3.37-armeabi-v7a.apk ;;
              *x86_64*) cp "$f" out/Routify-v0.3.37-x86_64.apk ;;
              *x86*) cp "$f" out/Routify-v0.3.37-x86.apk ;;
            esac
          done
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          U=out/Routify-v0.3.37-0-universal.apk
          zip -q -d $U 'lib/x86/*' 'lib/x86_64/*' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/MANIFEST.MF'
          $BT/zipalign -p -f 4 $U /tmp/u-aligned.apk
          $BT/apksigner sign --ks "$ROUTIFY_KEYSTORE_PATH" --ks-pass env:ROUTIFY_KEY_PASSWORD --key-pass env:ROUTIFY_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out $U /tmp/u-aligned.apk
          $BT/apksigner verify --print-certs $U | head -3
          for f in out/*.apk; do
            n=$(unzip -p "$f" 'classes*.dex' | grep -ac 'What Connect covers')
            echo "$f has new setting string: $n"; test "$n" -ge 1
            unzip -l "$f" | grep -c 'libhev-socks5-tunnel' || true
          done
          ls -l out
          for n in 0-universal arm64-v8a armeabi-v7a x86 x86_64; do test -f out/Routify-v0.3.37-$n.apk; done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: out

      - name: Publish v0.3.37
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=$(du -h out/Routify-v0.3.37-arm64-v8a.apk | cut -f1)
          V=$(du -h out/Routify-v0.3.37-armeabi-v7a.apk | cut -f1)
          X=$(du -h out/Routify-v0.3.37-x86.apk | cut -f1)
          Y=$(du -h out/Routify-v0.3.37-x86_64.apk | cut -f1)
          U=$(du -h out/Routify-v0.3.37-0-universal.apk | cut -f1)
          cat > notes.md <<NOTES
          Routify v0.3.37

          Which file to download:
          - Routify-v0.3.37-0-universal.apk ($U): main option. One file with the ARM types (arm64-v8a and armeabi-v7a). Works on almost every phone and tablet. Not for x86 devices.
          - Routify-v0.3.37-arm64-v8a.apk ($A): smaller, for most modern phones (64-bit ARM).
          - Routify-v0.3.37-armeabi-v7a.apk ($V): smaller, for older 32-bit ARM phones.
          - Routify-v0.3.37-x86_64.apk ($Y): 64-bit x86 devices and emulators.
          - Routify-v0.3.37-x86.apk ($X): 32-bit x86 devices and emulators.
          Not sure which one? Use the universal file.

          New in this version:
          - Icons are unchanged in this version.
          - README now has screenshots of every screen (taken from this version).
          - Includes v0.3.36 (Android permission prompts first) and everything before it.
          - Needs Android 10 or newer (not the Galaxy Tab A6, which stops at Android 8.1).
          - If Android says "App not installed", uninstall the older Routify first (for all users), then install this file.

          Known limits (honest):
          - Tested on an Android 11 emulator: the app installs and opens, every tab and the settings pages show, and connecting in proxy mode works. Root mode and a real tablet are not tested.
          - The device VPN carries TCP, UDP and DNS. IPv6 and local network addresses are not sent through the VPN.
          - Credits and third-party licenses are in the NOTICE file.
          - Signed with the permanent Routify key. Later updates install over this one.
          NOTES
          sed -i 's/^ *//' notes.md
          gh release create v0.3.37 out/Routify-v0.3.37-0-universal.apk out/Routify-v0.3.37-arm64-v8a.apk out/Routify-v0.3.37-armeabi-v7a.apk out/Routify-v0.3.37-x86_64.apk out/Routify-v0.3.37-x86.apk --target main --latest --title "Routify v0.3.37" --notes-file notes.md
          gh release view v0.3.37 --json assets --jq '.assets[] | [.name, .size] | @tsv'
