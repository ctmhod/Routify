name: Compile check foreground service

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked


      - name: Patch
        run: |
          cat > /tmp/patch.py <<'PY_EOF'
          K='mobile/src/main/java/be/mygod/vpnhotspot/'
          svc = """package be.mygod.vpnhotspot.xray

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.content.ContextCompat
          import be.mygod.vpnhotspot.App.Companion.app
          import be.mygod.vpnhotspot.R

          /** Keeps Routify alive in the background while the proxy is on, with a visible notification. */
          class XrayService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CHANNEL, "Routify connection", NotificationManager.IMPORTANCE_LOW))
                  val open = packageManager.getLaunchIntentForPackage(packageName)?.let {
            PendingIntent.getActivity(this, 0, it, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  }
                  val n = Notification.Builder(this, CHANNEL)
            .setContentTitle("Routify is on")
            .setContentText("Proxy running (HTTP 8080, SOCKS 1080). Tap to open.")
            .setSmallIcon(R.drawable.ic_route)
            .setOngoing(true)
            .setContentIntent(open)
            .build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(ID, n)
                  return START_NOT_STICKY
              }

              companion object {
                  private const val CHANNEL = "routify_connection"
                  private const val ID = 1701
                  fun start() = ContextCompat.startForegroundService(app, Intent(app, XrayService::class.java))
                  fun stop() { app.stopService(Intent(app, XrayService::class.java)) }
              }
          }
          """
          open(K+'xray/XrayService.kt','w',encoding='utf-8').write(svc)
          p='mobile/src/main/AndroidManifest.xml'
          t=open(p,encoding='utf-8').read()
          a='        <service\n            android:name=".TetheringService"'
          assert a in t and 'XrayService' not in t
          t=t.replace(a,'        <service\n            android:name=".xray.XrayService"\n            android:exported="false"\n            android:foregroundServiceType="specialUse">\n            <property\n                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"\n                android:value="Keep the local proxy running while Routify is in the background" />\n        </service>\n'+a,1)
          open(p,'w',encoding='utf-8').write(t)
          p=K+'xray/XrayController.kt'
          t=open(p,encoding='utf-8').read()
          a='                _message.value = "Proxy on (HTTP $HTTP_PORT, SOCKS $SOCKS_PORT)"\n'
          assert a in t
          t=t.replace(a,a+'                try { XrayService.start() } catch (e: Throwable) { appendLog("Background notification: ${e.javaClass.simpleName}") }\n',1)
          b='        try { proxyProc?.destroy() } catch (_: Throwable) { }\n        proxyProc = null\n'
          assert b in t
          t=t.replace(b,b+'        try { XrayService.stop() } catch (_: Throwable) { }\n',1)
          open(p,'w',encoding='utf-8').write(t)
          import os
          for f in ['audit.txt','audit2.txt','patchlog.txt','build.log']:
              if os.path.exists(f): os.remove(f)
          PY_EOF
          python3 /tmp/patch.py

      - name: Compile Kotlin
        run: |
          set +e
          ./gradlew :mobile:compileDebugKotlin --no-daemon > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E '^e: |error:|FAILED|What went wrong' -A2 /tmp/build.log | head -60
            tail -30 /tmp/build.log
            exit $code
          fi
          echo "Compile OK"

      - name: Commit
        run: |
          git add -A
          git -c user.name="ctmhod" -c user.email="290202009+ctmhod@users.noreply.github.com" commit -q -m "Foreground notification keeps the proxy alive in the background; remove stray logs"
          git pull --rebase origin main || true
          git push origin HEAD:main
